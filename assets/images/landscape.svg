<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1440" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dededb"/>
      <stop offset=".52" stop-color="#f4f4f1"/>
      <stop offset="1" stop-color="#c6c6c2"/>
    </linearGradient>
    <linearGradient id="ridge" x1="600" y1="680" x2="700" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777774"/>
      <stop offset="1" stop-color="#c7c7c3"/>
