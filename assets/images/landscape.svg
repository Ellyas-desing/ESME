      <stop offset="1" stop-color="#a4a4a0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <style>
      .reflection {
        transform-box: fill-box;
        transform-origin: center;
        animation: ripple 7s ease-in-out infinite;
      }
      @keyframes ripple {
        0%, 100% { opacity: .18; transform: scaleX(.84); }
        50% { opacity: .38; transform: scaleX(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .reflection { animation: none; }
      }
    </style>
  </defs>

